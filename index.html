function ans(i,b){const q=QZ[qi],bs=document.querySelectorAll(".btn.g");if(i==q[2])qs++;bs.forEach((x,j)=>{x.disabled=true;if(j==q[2])x.style.borderColor="#2ed3a0";else if(j==i)x.style.borderColor="#ff5d8f"});$("#ex").innerHTML=(i==q[2]?"<b class='ok'>Certo! </b>":"<b>Quase. </b>")+q[3]+`<div class="sp"></div><button class="btn" onclick="qi++;if(qi>=QZ.length){S.xp+=qs*4;S.min+=2;save()}render()">${qi+1>=QZ.length?"Ver resultado":"Próxima"}</button>`}
function prog(){const l=lvl(),a=ACH.map(([n,f])=>`<div class="chip ${f(S)?'on':''}">${n}</div>`).join("");return `<h1>Seu universo</h1><div class="card"><p class="mu">Você já transformou</p><div class="stat">${fmt(S.min)}</div><p class="mu">de tédio em experiências.</p></div><div class="sp"></div>
 <div class="grid sg"><div class="card"><div class="stat">${S.done.length}</div><span class="mu">experiências</span></div><div class="card"><div class="stat">${strk()}🔥</div><span class="mu">dias seguidos</span></div><div class="card"><div class="stat">${S.xp}</div><span class="mu">XP</span></div><div class="card"><div class="stat" style="font-size:1.2rem">${LV[l]}</div><span class="mu">nível</span></div></div><div class="card" style="margin-top:12px"><div class="tag">${LV[l]}${l<4?" · próximo nível em "+(TH[l+1]-S.xp)+" XP":""}</div><div style="height:8px;border-radius:9px;background:var(--bd)"><div style="height:8px;border-radius:9px;background:var(--ac);width:${l<4?Math.round((S.xp-TH[l])/(TH[l+1]-TH[l])*100):100}%"></div></div></div><h2>Perfil de curiosidade</h2><div class="card hl">${perfil()}</div><h2>Equilíbrio do seu universo</h2><div class="card">${radar()}</div><h2>Conquistas</h2><div class="chips">${a}</div>`}
function prof(){return `<h1>Personalizar</h1><h2 style="font-size:1rem">Tema</h2>${chips("theme",[["","Minimal"],["ocean","Ocean"],["forest","Forest"],["sunset","Sunset"],["lavender","Lavender"],["midnight","Midnight"],["sand","Sand"],["neon","Neon"]]).replace(/applyTheme/g,"")}<h2 style="font-size:1rem">Modo</h2>${chips("dark",[["auto","Auto"],["light","Claro"],["dark","Escuro"]])}<h2>Este navegador</h2><div class="card"><div class="tag">ID ${S.uid}</div><p class="mu">Cada navegador guarda só o que foi feito nele. Para levar seu progresso a outro, copie o código aqui e importe lá.</p><div class="row"><button class="btn g" onclick="cp()">Copiar código</button><button class="btn g" onclick="imp()">Importar</button></div></div><h2>Privacidade</h2><p class="mu">Sem conta. Tudo fica salvo apenas neste aparelho.</p><button class="btn g" onclick="if(confirm('Apagar tudo?')){localStorage.removeItem('agora');location.reload()}">Apagar meus dados</button>`}
let G={g:null},A={s:0};
const shf=a=>[...a].sort(()=>Math.random()-.5);
const pq=k=>{G.qk=k;QZ=shf(QB[k].call?QB[k]():QB[k]).slice(0,10).map(q=>q[1]==VF?q:(o=>[q[0],o,o.indexOf(q[1][q[2]]),q[3]])(shf(q[1])));qi=0;qs=0;view="quiz";render()};
const fm=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
function anti(){if(A.s==0)return `<div class="eyebrow">Modo antitédio</div><h1>Quanto tempo você tem?</h1>${chips("time",[[1,"1 min"],[5,"5 min"],[10,"10 min"],[20,"20 min"],[60,"1 hora"]])}<div class="sp"></div><button class="btn" onclick="A.s=1;render()">Perfeito</button>`;
 if(A.s==1)return `<h1>Como você está?</h1>${chips("mood",[["any","😐 Entediado"],["tired","😴 Cansado"],["energy","⚡ Energizado"]])}<h2>Agora escolha</h2><div class="grid">${catGrid().replace(/start\(pick\(\{cat:'(\w+)'\}\),0\)/g,"antiGo('$1')")}</div>`;
 const e=A.e;return `<div class="card cx" style="--c:${CC[e[1]]}"><div class="tag">Tenho uma missão para você</div><div class="big" id="tm">${fm(A.left)}</div><h1 style="font-size:1.4rem">${e[2]}</h1><ol>${e[6].map(p=>`<li>${p}</li>`).join("")}</ol><button class="btn" onclick="clearInterval(A.iv);A.s=0;done()">Concluí</button><div class="sp"></div><button class="btn g" onclick="antiGo('${e[1]}')">Trocar</button></div>`}
function antiGo(c){A.e=pick({cat:c});S.cur={id:A.e[0]};A.s=2;A.left=A.e[3]*60;clearInterval(A.iv);A.iv=setInterval(()=>{A.left=Math.max(0,A.left-1);const t=$("#tm");t?t.textContent=fm(A.left):clearInterval(A.iv)},1000);render()}
function perfil(){const m={aprender:"📚 Aprendiz",jogar:"😂 Caçador de diversão",criar:"🎨 Criador",descobrir:"🌎 Descobridor",desafiar:"🎯 Desafiador",relaxar:"🧘 Desacelerador",fora:"🧭 Explorador",social:"😂 Caçador de diversão"};if(S.done.length<3)return "Seu perfil de curiosidade está se formando. Faça mais algumas experiências.";const c={};S.done.forEach(i=>{const k=(ex(i)||[])[1];if(k)c[k]=(c[k]||0)+1});const t=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return `<div class="stat">${m[t]}</div><p class="mu">Uma classificação divertida, não um diagnóstico.</p>`}
function cp(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));navigator.clipboard?navigator.clipboard.writeText(c).then(()=>alert("Código copiado."),()=>prompt("Copie:",c)):prompt("Copie:",c)}
function imp(){const c=prompt("Cole o código:");if(!c)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!Array.isArray(o.done))throw 0;S=Object.assign({},S,o,{uid:S.uid});save();render()}catch(e){alert("Código inválido.")}}
function pp(){G.w=0;G.l=0;$("#gm").innerHTML=`<div class="card"><div class="tag">Pedra, papel e tesoura</div><div class="row">${["✊","✋","✌️"].map((x,i)=>`<button class="btn g" style="font-size:2rem" aria-label="Opção ${i+1}" onclick="pj(${i})">${x}</button>`).join("")}</div><p id="pr" class="mu" aria-live="polite">Escolha uma opção.</p></div>`}
function pj(i){const c=Math.floor(Math.random()*3),r=(i-c+3)%3;if(r==1)G.w++;else if(r==2)G.l++;$("#pr").textContent=["✊","✋","✌️"][c]+" — "+(r==0?"Empate":r==1?"Você venceu!":"Você perdeu")+` · ${G.w} x ${G.l}`;if(r==1)reward()}
function hl(){G.a=1+Math.floor(Math.random()*100);G.k=0;hr()}
function hr(){$("#gm").innerHTML=`<div class="card"><div class="tag">Maior ou menor · sequência ${G.k}</div><div class="big">${G.a}</div><p class="mu" style="text-align:center">O próximo (1 a 100) será maior ou menor?</p><div class="row"><button class="btn" onclick="hg(1)">Maior ↑</button><button class="btn g" onclick="hg(0)">Menor ↓</button></div></div>`}
function hg(u){const n=1+Math.floor(Math.random()*100);if(n==G.a)return hg(u);if((n>G.a)==!!u){G.k++;G.a=n;if(G.k%3==0)reward();hr()}else $("#gm").innerHTML=`<div class="card"><div class="big">${n}</div><p style="text-align:center">Errou! Sequência final: ${G.k}</p><button class="btn" onclick="hl()">Jogar de novo</button></div>`}
const DL=[["Viajar ao passado","Viajar ao futuro"],["Nunca mais usar redes sociais","Nunca mais assistir vídeos"],["Saber todos os idiomas","Tocar todos os instrumentos"],["Voar","Ficar invisível"],["Verão para sempre","Inverno para sempre"],["Ter mais tempo","Ter mais dinheiro"],["Morar na praia","Morar na montanha"],["Ler mentes","Prever o futuro"],["Acordar às 5h sempre","Dormir às 3h sempre"]];
function pf(){const d=DL[Math.floor(Math.random()*DL.length)];$("#gm").innerHTML=`<div class="card"><div class="tag">Você prefere?</div>${d.map(o=>`<button class="btn g" style="margin:6px 0" onclick="pf()">${o}</button>`).join("")}</div>`}
function mp(){const e=["🌵","🐙","🍉","🎸","🚀","🧩","🦊","🌙"],d=[...e,...e].sort(()=>Math.random()-.5);G.d=d;G.o=[];G.m=0;G.f=0;$("#gm").innerHTML=`<div class="card"><div class="tag">Jogo da memória · <span id="mv">0</span> jogadas</div><div class="grid" style="grid-template-columns:repeat(4,1fr)">${d.map((_,i)=>`<button id="c${i}" class="btn g" style="height:64px;font-size:1.6rem;padding:0" aria-label="Carta ${i+1}" onclick="mc(${i})">?</button>`).join("")}</div></div>`}
function mc(i){const b=$("#c"+i);if(G.o.length>1||G.o.includes(i)||b.dataset.ok)return;b.textContent=G.d[i];G.o.push(i);if(G.o.length==2){G.m++;$("#mv").textContent=G.m;const[a,c]=G.o;if(G.d[a]==G.d[c]){G.o=[];[a,c].forEach(x=>$("#c"+x).dataset.ok=1);if(++G.f==8){reward();$("#mv").parentNode.innerHTML="🎉 Completou em "+G.m+" jogadas"}}else setTimeout(()=>{[a,c].forEach(x=>$("#c"+x).textContent="?");G.o=[]},700)}}
function qsel(){return `<h1>Quiz do Agora</h1><p class="mu">Escolha uma categoria.</p><div class="grid">`+[["curiosidades","🧠","Curiosidades","#5b8cff"],["ciencia","🔬","Ciência","#2ed3a0"],["geografia","🌎","Geografia","#4cc9f0"],["brasil","🇧🇷","Brasil","#ffd23f"],["corpo","🫀","Corpo humano","#ff5d8f"],["matematica","➗","Matemática","#ff7a45"],["capitais","📍","Capitais","#9be564"],["vf","✅","Verdadeiro ou falso","#b36bff"],["espaco","🪐","Espaço","#7c9cff"],["tecnologia","💻","Tecnologia","#4cc9f0"],["historia","📜","História","#e0a96d"],["futebol","⚽","Futebol","#2ed3a0"],["natureza","🌿","Natureza","#9be564"],["psicologia","🧩","Psicologia","#b36bff"],["bandeiras","🚩","Bandeiras","#ff5d8f"],["elementos","⚗️","Elementos","#4cc9f0"],["livros","📖","Literatura","#ffd23f"],["contas","🔢","Contas rápidas","#ff7a45"]].map(([k,i,t,c])=>`<button class="cat" style="--c:${c}" onclick="pq('${k}')"><span class="ic">${i}</span>${t}</button>`).join("")+`</div>`}
const reward=()=>{S.xp+=5;S.min+=1;save()};
function games(){setTimeout(()=>{const f={r:rx,n:nm,s:sq,p:pp,h:hl,v:pf,m:mp}[G.g];f&&f()},0);return `<h1>Jogos rápidos</h1><p class="mu">Sem cadastro. Cada rodada rende XP.</p><div class="grid" style="grid-template-columns:1fr">`+[["r","⚡","Teste de reflexo","#ffd23f"],["n","🔢","Número secreto","#5b8cff"],["s","🧩","Sequência de memória","#ff5d8f"],["p","✌️","Pedra, papel e tesoura","#4cc9f0"],["h","↕️","Maior ou menor","#ff7a45"],["v","🤔","Você prefere?","#b36bff"],["m","🃏","Jogo da memória","#2ed3a0"]].map(([k,i,t,c])=>`<button class="cat" style="--c:${c}" onclick="G.g='${k}';render()"><span class="ic">${i}</span>${t}</button>`).join("")+`</div><div class="sp"></div><div id="gm"></div>`}
function rx(){clearTimeout(G.t);G.s=0;$("#gm").innerHTML=`<div class="card"><div class="tag">Reflexo</div><button id="rb" class="btn g" style="height:150px" onclick="rxc()">Toque para começar</button></div>`}
function rxc(){const b=$("#rb");if(G.s==0){G.s=1;b.textContent="Espere ficar verde…";G.t=setTimeout(()=>{G.s=2;G.t0=performance.now();b.textContent="AGORA!";b.style.background="#2ed3a0";b.style.color="#04140d"},1000+Math.random()*2500)}else if(G.s==1){clearTimeout(G.t);G.s=0;b.textContent="Cedo demais! Toque para tentar de novo"}else{const ms=Math.round(performance.now()-G.t0);G.s=0;b.style.background="";b.style.color="";b.textContent=ms+" ms — toque para repetir";reward()}}
function nm(){G.n=1+Math.floor(Math.random()*50);G.c=0;$("#gm").innerHTML=`<div class="card"><div class="tag">Número secreto</div><p>Adivinhe um número de 1 a 50.</p><input id="ni" type="number" inputmode="numeric" min="1" max="50" aria-label="Seu palpite" style="width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit"><div class="sp"></div><button class="btn" onclick="ng()">Palpitar</button><p id="nm" class="mu" aria-live="polite"></p></div>`}
function ng(){const v=+$("#ni").value;if(!v)return;G.c++;const m=$("#nm");if(v==G.n){m.textContent="Acertou em "+G.c+" tentativas!";reward();setTimeout(()=>G.g=="n"&&$("#gm")&&nm(),1800)}else m.textContent=v<G.n?"Maior ↑":"Menor ↓"}
const PC=["#5b8cff","#ff5d8f","#2ed3a0","#ffd23f"];
function sq(){G.tok=(G.tok||0)+1;G.q=[];G.i=0;G.lock=true;$("#gm").innerHTML=`<div class="card"><div class="tag">Sequência de memória</div><div class="grid" style="grid-template-columns:1fr 1fr;max-width:300px;margin:auto">${PC.map((c,i)=>`<button id="p${i}" aria-label="Cor ${i+1}" onclick="sp(${i})" style="height:90px;border-radius:18px;border:0;background:${c};opacity:.4"></button>`).join("")}</div><p id="sm" class="mu" aria-live="polite" style="text-align:center">Observe…</p><button class="btn g" onclick="sq()">Reiniciar</button></div>`;sn()}
function fl(i,d=350){const b=$("#p"+i);if(!b)return;b.style.opacity=1;setTimeout(()=>b.style.opacity=.4,d-80)}
function sn(){G.q.push(Math.floor(Math.random()*4));G.i=0;G.lock=true;const m=$("#sm");m&&(m.textContent="Observe… nível "+G.q.length);const tk=G.tok;G.q.forEach((c,k)=>setTimeout(()=>tk==G.tok&&fl(c),700+k*500));setTimeout(()=>{if(tk!=G.tok)return;G.lock=false;const m=$("#sm");m&&(m.textContent="Sua vez")},700+G.q.length*500)}
function sp(i){if(G.lock)return;fl(i,200);if(i!=G.q[G.i]){G.lock=true;$("#sm").textContent="Você chegou ao nível "+(G.q.length-1)+". Reinicie para tentar de novo.";if(G.q.length>1)reward();return}G.i++;if(G.i==G.q.length){G.lock=true;{const tk=G.tok;setTimeout(()=>tk==G.tok&&sn(),600)}}}
const VM={quiz:"explore",qsel:"explore",games:"explore",exp:"home",done:"home",anti:"home"};
function acceptM(){S.mission=day()+mission()[0];start(mission(),0)}
function sug(){if(!S.done.length)return "";const e=pick({ex:S.done[S.done.length-1]});return `<h2>Talvez você goste disso</h2><div class="card cx" style="--c:${CC[e[1]]}"><span class="pill">${CATS[e[1]]}</span><p><b>${e[2]}</b></p><button class="btn g" onclick="start(X.find(x=>x[0]=='${e[0]}'),0)">Começar</button></div>`}
const NAV=[["home","🏠","Início"],["spin","🎲","Surpresa"],["explore","🧠","Explorar"],["prog","🏆","Progresso"],["prof","⚙️","Perfil"]];
let pv="";function render(){if(view=="exp"&&!S.cur)view="home";if(view!=pv){pv=view;scrollTo(0,0)}applyTheme();const V={home,exp,done:doneV,spin:spinV,explore,quiz,prog,prof,games,qsel,anti};app.innerHTML=V[view]();
 $("nav").innerHTML=NAV.map(([k,i,l],_,__,cv=VM[view]||view)=>`<button class="${cv==k?'on':''}" ${cv==k?'aria-current="page"':''} onclick="view='${k}';render();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join("")}
// link compartilhado
const h=location.hash.slice(1),sh=X.find(x=>x[0]==h);if(sh){S.cur={id:sh[0]};view="exp"}
render();
</script></body></html>
